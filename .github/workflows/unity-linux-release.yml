# Builds the Unity game for Linux and attaches it to an existing GitHub release (e.g. the Windows release made on the
# author's computer). Unity builds only the player (code and shaders): the million-triangle models and 4K pictures are
# converted afterwards straight into the built game's StreamingAssets, so the editor never copies gigabytes (copying
# them inside the Unity build killed the runner). The game goes up as .tar.gz parts under GitHub's 2 GB limit with an
# install script (no root: ~/.local/share/fishingsim, a menu entry, the `fishingsim` command).
# Needs the UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD secrets.
name: Unity Linux release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to build"
        default: "unity-v0.12.0"
      tag:
        description: "Existing release (tag) to attach the Linux files to"
        default: "unity-v0.12.0"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          sparse-checkout: |
            unity
            tools/release
            tools/unity
            assets/fish/meshy
            assets/models
            assets/characters
            assets/textures
      - name: Install script from this workflow's branch
        run: |
          git fetch --depth 1 origin "${{ github.sha }}"
          git show "${{ github.sha }}:tools/release/linux/install.sh" > "$RUNNER_TEMP/install.sh"
          chmod +x "$RUNNER_TEMP/install.sh"
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-linux-player-${{ hashFiles('unity/Packages/manifest.json') }}
          restore-keys: Library-StandaloneLinux64-
      - name: Version
        id: ver
        run: |
          v=$(grep -m1 'bundleVersion:' unity/ProjectSettings/ProjectSettings.asset | sed 's/.*bundleVersion: *//' | tr -d ' \r')
          [ -n "$v" ] || v=$(tr -d ' \n' < tools/release/VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version $v"
      - name: Build the Linux player (code and shaders only)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: StandaloneLinux64
          unityVersion: 6000.0.64f1
          buildName: FishingSim
          buildMethod: FishingSim.EditorTools.BuildGame.Build
          versioning: None
      - name: Models and pictures into the built game
        run: |
          sudo chown -R "$USER" build
          exe=$(find build/StandaloneLinux64 -maxdepth 1 -name 'FishingSim*.x86_64' -type f | head -1)
          [ -n "$exe" ] || { echo "no player built"; ls -la build/StandaloneLinux64; exit 1; }
          data="${exe%.x86_64}_Data"
          SA="$data/StreamingAssets"
          mkdir -p "$SA"
          python3 -m venv "$RUNNER_TEMP/cv" && "$RUNNER_TEMP/cv/bin/pip" install --quiet pillow numpy
          PY="$RUNNER_TEMP/cv/bin/python"
          $PY -I tools/unity/convert_glb.py assets/fish/meshy "$SA/Models/fish" --fish --max 2048
          $PY -I tools/unity/convert_glb.py assets/models "$SA/Models" --max 4096
          $PY -I tools/unity/convert_glb.py assets/characters "$SA/Models/characters" --max 2048
          $PY -I tools/unity/convert_textures.py assets/characters/textures "$SA/Models/characters/textures" --max 2048
          for d in assets/textures/*/; do
            id=$(basename "$d")
            $PY -I tools/unity/convert_textures.py "$d" "$SA/Textures/$id" --max 4096 > /dev/null
            cp "$d"/*.json "$SA/Textures/$id/" 2>/dev/null || true
          done
          rm -rf assets
          du -sh "$SA" build/StandaloneLinux64
          df -h /
      - name: Quick start check (virtual screen)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libgl1-mesa-dri > /dev/null
          exe=$(find build/StandaloneLinux64 -maxdepth 1 -name 'FishingSim*.x86_64' -type f | head -1)
          chmod +x "$exe"
          FISHSIM_SMOKE=1 FISHSIM_NO_SAVE=1 timeout 600 xvfb-run -a -s "-screen 0 640x360x24" "$exe" -force-glcore \
            -screen-fullscreen 0 -screen-width 640 -screen-height 360 -logFile "$RUNNER_TEMP/smoke.log" || true
          grep -E "SMOKE|Exception" "$RUNNER_TEMP/smoke.log" | grep -v "SMOKE JPEG" | cut -c1-300 | head -60 || true
      - name: Package (tar.gz parts + install script)
        run: |
          v="${{ steps.ver.outputs.version }}"
          name="FishingSim-$v-Linux"
          mkdir -p dist "$RUNNER_TEMP/stage/$name"
          src=build/StandaloneLinux64
          (cd "$src" && tar --exclude='*BackUpThisFolder*' --exclude='*DoNotShip*' -cf - .) | (cd "$RUNNER_TEMP/stage/$name" && tar -xf -)
          cp tools/release/icon.png "$RUNNER_TEMP/stage/$name/icon.png"
          exe=$(find "$RUNNER_TEMP/stage/$name" -maxdepth 1 -name 'FishingSim*.x86_64' -type f | head -1)
          [ "$(basename "$exe")" = FishingSim.x86_64 ] || { mv "$exe" "$RUNNER_TEMP/stage/$name/FishingSim.x86_64"; mv "${exe%.x86_64}_Data" "$RUNNER_TEMP/stage/$name/FishingSim_Data"; }
          chmod +x "$RUNNER_TEMP/stage/$name/FishingSim.x86_64"
          rm -rf build
          tar -C "$RUNNER_TEMP/stage" -czf - "$name" | split -b 1900M -d -a 1 - "dist/$name.tar.gz.part-"
          rm -rf "$RUNNER_TEMP/stage"
          cp "$RUNNER_TEMP/install.sh" dist/install.sh
          (cd dist && sha256sum FishingSim-*.part-* > SHA256SUMS)
          ls -la dist
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          append_body: true
          body: |

            ### Linux (Fedora, Ubuntu i inne, 64-bit)
            1. Pobierz do jednego folderu wszystkie pliki `FishingSim-${{ steps.ver.outputs.version }}-Linux.tar.gz.part-*` oraz `install.sh` i `SHA256SUMS`.
            2. W terminalu w tym folderze: `chmod +x install.sh && ./install.sh` (bez roota: gra trafia do `~/.local/share/fishingsim`, skrót w menu i polecenie `fishingsim`).
            3. Odinstalowanie: `./install.sh --uninstall`.

            Wymagania: karta z Vulkanem lub OpenGL 4.5, ok. 3 GB miejsca.
          files: |
            dist/*.part-*
            dist/install.sh
            dist/SHA256SUMS
