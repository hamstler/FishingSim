# Builds the Unity port (unity/) for Windows and Linux with GameCI. Needs the repository secrets UNITY_LICENSE
# (the contents of the Unity_lic.ulf file of a Unity Personal licence activated in Unity Hub), UNITY_EMAIL and
# UNITY_PASSWORD (Settings -> Secrets and variables -> Actions). Runs by hand or on a push whose message holds [unity].
name: Unity build

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[unity]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [StandaloneWindows64, StandaloneLinux64]
    steps:
      # The runner has ~14 GB free: Unity's editor image and the build do not fit beside the preinstalled SDKs,
      # and a full checkout of the Godot game's models. Free space and fetch only the Unity project.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          # importing the million-triangle Meshy buildings needs more than the runner's 8 GB of memory
          sudo swapoff -a || true
          sudo fallocate -l 20G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            unity
            .github
            tools/release
            tools/unity
            assets/fish/meshy
            assets/models
            assets/characters
            assets/textures
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-${{ matrix.target }}-${{ hashFiles('unity/Packages/manifest.json', 'tools/unity/convert_glb.py') }}-models2
          restore-keys: Library-${{ matrix.target }}-
      - name: Convert the Meshy models for Unity
        run: |
          python3 -m venv "$RUNNER_TEMP/cv" && "$RUNNER_TEMP/cv/bin/pip" install --quiet pillow numpy
          "$RUNNER_TEMP/cv/bin/python" -I tools/unity/convert_glb.py assets/fish/meshy unity/Assets/StreamingAssets/Models/fish --fish --max 2048
          # the full-look models, as in the Godot game (read at run time by glTFast, never imported by the editor)
          "$RUNNER_TEMP/cv/bin/python" -I tools/unity/convert_glb.py assets/models unity/Assets/StreamingAssets/Models --max 4096
          "$RUNNER_TEMP/cv/bin/python" -I tools/unity/convert_glb.py assets/characters unity/Assets/StreamingAssets/Models/characters --max 2048
          "$RUNNER_TEMP/cv/bin/python" -I tools/unity/convert_textures.py assets/characters/textures unity/Assets/StreamingAssets/Models/characters/textures --max 2048
          for d in assets/textures/*/; do
            id=$(basename "$d")
            "$RUNNER_TEMP/cv/bin/python" -I tools/unity/convert_textures.py "$d" "unity/Assets/StreamingAssets/Textures/$id" --max 4096 > /dev/null
            cp "$d"/*.json "unity/Assets/StreamingAssets/Textures/$id/" 2>/dev/null || true
          done
          rm -rf assets
          du -sh unity/Assets/StreamingAssets/Models
          df -h /
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: ${{ matrix.target }}
          unityVersion: 6000.0.64f1
          buildName: FishingSim
          buildMethod: FishingSim.EditorTools.BuildGame.Build
          versioning: None
      - name: Smoke test (Linux build under a virtual screen)
        if: matrix.target == 'StandaloneLinux64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa > /dev/null
          exe=$(find build/StandaloneLinux64 -maxdepth 1 -name 'FishingSim*' -type f | head -1)
          sudo chown -R "$(id -u):$(id -g)" build
          chmod +x "$exe"
          set +e
          FISHSIM_SMOKE=1 FISHSIM_NO_SAVE=1 timeout 900 xvfb-run -a -s "-screen 0 640x360x24" "$exe" -force-glcore -screen-fullscreen 0 -screen-width 640 -screen-height 360 -logFile "$RUNNER_TEMP/smoke.log"
          code=$?
          set -e
          grep -E -A6 "SMOKE|Exception|ERROR|Shader|shader" "$RUNNER_TEMP/smoke.log" | grep -v "SMOKE JPEG" | cut -c1-400 | head -200
          grep "SMOKE JPEG" "$RUNNER_TEMP/smoke.log" || true
          echo "exit $code"
          grep -q "SMOKE OK" "$RUNNER_TEMP/smoke.log"
      - uses: actions/upload-artifact@v4
        with:
          name: FishingSim-unity-${{ matrix.target }}
          path: build/${{ matrix.target }}
          retention-days: 7
