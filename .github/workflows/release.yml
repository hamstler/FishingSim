# Builds the game for Windows and Linux and publishes a GitHub release:
#   - FishingSim-<ver>-windows-setup.exe (Inno Setup installer), FishingSim-<ver>-windows-x86_64.zip
#   - fishingsim_<ver>_amd64.deb, FishingSim-<ver>-linux-x86_64.tar.gz
# Runs on a v* tag, by hand (Actions -> Release -> Run workflow), or on a push whose commit message holds [release].
# The version is the tag's (without the v), the input's, or tools/release/VERSION.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (empty = tools/release/VERSION)"
        required: false

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.3-stable

jobs:
  export:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Version
        id: ver
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          if [ -z "$v" ]; then v="$(tr -d ' \n' < tools/release/VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Godot and export templates
        run: |
          cd "$RUNNER_TEMP"
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v4.3-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$RUNNER_TEMP/Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          curl -sSL -o templates.tpz "$GODOT_URL/Godot_v4.3-stable_mono_export_templates.tpz"
          unzip -q templates.tpz
          dest="$HOME/.local/share/godot/export_templates/4.3.stable.mono"
          mkdir -p "$dest"
          mv templates/* "$dest/"
          rm -f godot.zip templates.tpz
          ls "$dest"

      - name: Build C#
        run: dotnet build -c Release

      - name: Import project
        run: |
          "$GODOT" --headless --import --path . || true
          test -d .godot/imported

      - name: Export Linux
        run: |
          mkdir -p build/linux
          "$GODOT" --headless --path . --export-release "Linux" build/linux/FishingSim.x86_64
          test -f build/linux/FishingSim.x86_64 && test -f build/linux/FishingSim.pck
          cp LICENSE README.md build/linux/

      - name: Export Windows
        run: |
          mkdir -p build/windows
          "$GODOT" --headless --path . --export-release "Windows" build/windows/FishingSim.exe
          test -f build/windows/FishingSim.exe && test -f build/windows/FishingSim.pck
          cp LICENSE README.md build/windows/

      - name: Linux packages
        run: tools/release/package_linux.sh "${{ steps.ver.outputs.version }}" build/linux build/dist

      - name: Windows zip
        run: cd build/windows && zip -qr9 "../dist/FishingSim-${{ steps.ver.outputs.version }}-windows-x86_64.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: build/dist
          retention-days: 3

  installer:
    needs: export
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools/release
            LICENSE
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build/windows
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ needs.export.outputs.version }}" "/DSourceDir=$PWD\build\windows" "/DOutDir=$PWD\build\dist" tools\release\FishingSim.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: build/dist
          retention-days: 3

  publish:
    needs: [export, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.export.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Fishing Sim ${{ needs.export.outputs.version }}
          body: |
            Fishing Sim ${{ needs.export.outputs.version }}

            **Windows:** pobierz `FishingSim-${{ needs.export.outputs.version }}-windows-setup.exe` i uruchom instalator (albo rozpakuj wersję `.zip`).
            **Linux:** `sudo apt install ./fishingsim_${{ needs.export.outputs.version }}_amd64.deb` (uruchom: `fishingsim` lub z menu), albo rozpakuj `.tar.gz` i uruchom `FishingSim.x86_64`.

            Wymagania: karta graficzna z Vulkanem (Forward+). Pierwsze uruchomienie przygotowuje tekstury w tle (kilka minut).
            © 2026 Krystian Naskręski, wszelkie prawa zastrzeżone (zob. LICENSE). Materiały innych autorów: zob. README / CREDITS.md.
          files: dist/*
          fail_on_unmatched_files: true
